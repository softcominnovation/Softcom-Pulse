name: Publish production

on:
  push:
    tags:
      - 'v*.*.*'
      - '!*-*'
      - '!*\+*'

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-production
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/softcominnovation/softcom-pulse

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: postgresql://pulse_ci:pulse_ci@127.0.0.1:5432/pulse
      REDIS_URL: redis://127.0.0.1:6379
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: pulse_ci
          POSTGRES_PASSWORD: pulse_ci
          POSTGRES_DB: pulse
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U pulse_ci -d pulse"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:8-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 3s --health-retries 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Validate tag and branch ancestry
        id: release
        run: node scripts/validate-release.mjs production
      - name: Install dependencies
        run: npm ci
      - name: Validate application
        run: npm run check
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Validate migrations and production runtime
        run: |
          npm run test:integration
          npm run test:runtime
      - name: Validate components and responsive interface
        run: |
          npm run test:components
          npm run test:ui
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: metadata
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ steps.release.outputs.version }}
            type=raw,value=${{ steps.release.outputs.minor }}
            type=raw,value=${{ steps.release.outputs.major }}
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=production
          cache-to: type=gha,mode=max,scope=production
      - name: Verify platforms and packaged runtime
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          image="$IMAGE@$IMAGE_DIGEST"
          docker buildx imagetools inspect "$image" --raw > manifest.json
          node --input-type=module -e 'import fs from "node:fs"; const m=JSON.parse(fs.readFileSync("manifest.json","utf8")); for (const arch of ["amd64","arm64"]) if (!m.manifests.some(x=>x.platform?.os==="linux" && x.platform?.architecture===arch)) process.exit(1);'
          for arch in amd64 arm64; do
            platform_digest=$(node scripts/platform-digest.mjs manifest.json "$arch")
            docker run --rm --platform "linux/$arch" --entrypoint node "$IMAGE@$platform_digest" --input-type=module -e 'import fs from "node:fs"; if (process.getuid() === 0) process.exit(1); for (const p of ["server.js","node_modules/prisma/build/index.js","node_modules/@prisma/engines","prisma/schema.prisma","prisma/migrations/migration_lock.toml","prisma.config.ts","collector/index.mjs","docker/migration-lock.mjs","docker/migrate.mjs","docker/entrypoint.sh","public/logo.ico","public/images/login-image.png","public/images/softcom-logo.png","public/images/404.png",".next/static"]) fs.accessSync(p); await import("pg"); await import("redis"); const {spawnSync}=await import("node:child_process"); const check=spawnSync(process.execPath,["--conditions=react-server","collector/index.mjs","--check"],{stdio:"inherit"}); if(check.status!==0) process.exit(1);'
          done
