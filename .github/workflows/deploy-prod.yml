name: Publish production

on:
  push:
    tags:
      - 'v*.*.*'
      - '!*-*'
      - '!*\+*'

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-production
  cancel-in-progress: false

jobs:
  publish:
    uses: ./.github/workflows/release.yml
    with:
      environment: production
